<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulation Results — Run in Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1628; --surface: #0f1d35; --surface2: #132240;
    --border: #1a2d52; --text: #e8edf5; --text-dim: #9bb0d4;
    --orange: #f37021; --blue: #6cace4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse at 80% 0%, rgba(243,112,33,0.08) 0%, transparent 50%);
    color: var(--text);
    font-family: 'Source Code Pro', monospace;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center;
  }
  h1 { font-family: 'Fraunces', serif; font-size: 32px; color: var(--orange); margin-bottom: 16px; }
  p { color: var(--text-dim); font-size: 14px; margin-bottom: 8px; }
  .spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 3px solid var(--border); border-top-color: var(--orange);
    border-radius: 50%; animation: spin 1s linear infinite;
    margin: 24px 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { font-size: 11px; color: #5e7aa3; margin-top: 24px; }
</style>
</head>
<body>
<div>
  <div class="spinner"></div>
  <h1>Simulation Running</h1>
  <p>12 sprints · 15 claims/sprint · DeepSeek</p>
  <p>~$3 · ~1 hour · ~2,500 LLM calls</p>
  <p style="color:var(--blue);margin-top:12px;">This page will update when the run completes.</p>
  <p class="meta">AI Transformation Experiment — Progressive Insurance Simulation</p>
</div>
</body>
</html>
