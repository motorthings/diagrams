<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="120">
<title>Simulation Results — Sprint 3/12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {--bg:#0a1628;--surface:#0f1d35;--surface2:#132240;--border:#1a2d52;--text:#e8edf5;--text-dim:#9bb0d4;--orange:#f37021;--blue:#6cace4}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);background-image:radial-gradient(ellipse at 80% 0%,rgba(243,112,33,0.08) 0%,transparent 50%);color:var(--text);font-family:'Source Code Pro',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
  h1{font-family:'Fraunces',serif;font-size:32px;color:var(--orange);margin-bottom:16px}
  p{color:var(--text-dim);font-size:14px;margin-bottom:8px}
  .progress-bar{width:320px;height:6px;background:var(--border);border-radius:3px;margin:24px auto;overflow:hidden}
  .progress-fill{height:100%;background:var(--orange);border-radius:3px;width:25%;transition:width 0.5s}
  .sprint-count{font-family:'Fraunces',serif;font-size:48px;font-weight:700;color:var(--blue)}
  .spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .meta{font-size:11px;color:#5e7aa3;margin-top:24px}
</style>
</head>
<body>
<div>
  <div class="sprint-count"><span class="spinner"></span>3<span style="font-size:20px;color:var(--text-dim)"> / 12</span></div>
  <h1>Sprints Complete</h1>
  <div class="progress-bar"><div class="progress-fill"></div></div>
  <p>12 sprints · 15 claims/sprint · DeepSeek</p>
  <p>~$3 · ~1 hour · ~2,500 LLM calls</p>
  <p style="color:var(--blue);margin-top:12px;">Full dashboard when complete.</p>
  <p class="meta">AI Transformation Experiment — Progressive Insurance Simulation</p>
</div>
</body>
</html>
