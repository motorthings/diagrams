<style>
:root {
  --ink:#1F1A1C; --graphite:#3D3A3C; --body:#55504E; --muted:#76716F;
  --rule-hair:#D6D2D0; --rule-faint:#E7E4E2; --sheet:#FAF8F7; --desk:#E8E5E1;
  --accent:#EFAE42;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Public Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace; --cond:'Anton',Impact,sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--desk); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
.backlink { max-width:1140px; margin:0 auto; padding:20px 28px 8px; }
.backlink a { font-size:14px; color:var(--muted); text-decoration:none; }
.backlink a:hover { color:var(--accent); }
.sheet { max-width:1140px; margin:0 auto 72px; background:var(--sheet); display:grid; grid-template-columns:56px 1fr; }
.spine { background:var(--ink); display:flex; align-items:flex-end; justify-content:center; padding:30px 0; }
.spine-label { writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--cond); font-size:18px; letter-spacing:0.2em; color:var(--sheet); text-transform:uppercase; white-space:nowrap; }
.content { padding:54px 58px 62px; }
.masthead { display:flex; align-items:flex-end; justify-content:space-between; gap:30px; border-bottom:3px solid var(--ink); padding-bottom:12px; }
.masthead h1 { font-family:var(--serif); font-weight:400; font-size:44px; line-height:1.05; letter-spacing:-0.014em; max-width:760px; }
.masthead-num { font-family:var(--serif); font-size:72px; line-height:0.95; color:var(--accent); }
.links { display:flex; flex-direction:column; margin-top:8px; }
a.link { display:block; text-decoration:none; color:inherit; padding:14px 0 14px 24px; border-top:1px solid var(--rule-faint); }
a.link:first-child { border-top:none; }
a.link .link-title { display:block; font-size:16px; font-weight:700; color:var(--ink); line-height:1.4; }
a.link .link-desc { display:block; font-size:14px; color:var(--body); line-height:1.5; margin-top:2px; }
a.link:hover .link-title { color:var(--accent); }
.footer { border-top:3px solid var(--ink); margin-top:20px; padding:24px 0 0; }
.footer .rule-line { font-size:14px; color:var(--body); line-height:1.7; }
.footer a { color:var(--accent); text-decoration:none; }
.footer a:hover { text-decoration:underline; }
@media (max-width:760px) { .sheet { grid-template-columns:1fr; } .spine { display:none; } .content { padding:40px 24px 48px; } .masthead h1 { font-size:30px; } .masthead-num { font-size:48px; } a.link { padding-left:0; } }
</style>
</head>
